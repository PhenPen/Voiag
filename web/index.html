<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voiag</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --fg: #f2f2f2;
        --muted: #8a8a90;
        --line: #26262a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      main {
        width: 100%;
        max-width: 560px;
      }

      header { margin-bottom: 28px; }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .status {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: currentColor;
        vertical-align: middle;
      }

      button {
        font: inherit;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        cursor: pointer;
      }

      button:disabled { opacity: 0.5; cursor: default; }

      .call { width: 100%; font-weight: 600; }

      .mic-notice {
        margin: 10px 0 0;
        color: #ff8a8a;
        font-size: 13px;
      }

      .mic-notice:empty { margin: 0; }

      .log {
        height: 46vh;
        min-height: 220px;
        margin: 24px 0 16px;
        padding: 16px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 14px;
      }

      .line { margin-bottom: 10px; }

      .who {
        display: inline-block;
        min-width: 52px;
        margin-right: 8px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .line.agent .who { color: var(--fg); }
      .line.error { color: #ff8a8a; }
      .line.system { color: var(--muted); font-style: italic; }

      .type { display: flex; gap: 8px; }

      .type input {
        flex: 1 1 0;
        min-width: 0;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 18px;
      }

      .type input:focus { outline: 1px solid var(--fg); }

      .type button { padding: 12px 20px; }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }

      .toggle input { accent-color: var(--fg); margin: 0; }

      .conversation-title { display: none; }

      @media (min-width: 900px) {
        body {
          align-items: start;
          padding: clamp(32px, 5vw, 80px);
        }

        main {
          display: grid;
          grid-template-columns: clamp(245px, 24vw, 320px) minmax(0, 1fr);
          align-items: start;
          gap: clamp(24px, 3vw, 48px);
          max-width: 1456px;
        }

        .call-panel,
        .conversation {
          background: #111113;
          border: 1px solid var(--line);
          border-radius: 18px;
          padding: clamp(22px, 2.2vw, 36px);
        }

        .call-panel h1 { font-size: 26px; }
        .call-panel .sub { font-size: 14px; }

        .conversation-title {
          display: block;
          margin: 0 0 18px;
          font-size: 19px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        .log {
          height: clamp(320px, calc(100dvh - 280px), 780px);
          margin: 0 0 20px;
          padding: 24px;
          background: var(--bg);
          font-size: 16px;
        }

        .log:empty::before {
          content: "Start a call to see the conversation here.";
          color: var(--muted);
          font-size: 14px;
        }

        .line {
          display: grid;
          grid-template-columns: 64px minmax(0, 1fr);
          align-items: baseline;
          gap: 16px;
          margin-bottom: 16px;
          max-width: 74ch;
          overflow-wrap: anywhere;
        }

        .who { margin-right: 0; }
        .type { gap: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="call-panel">
        <header>
          <h1>Northside Studio</h1>
          <p class="sub">voice receptionist</p>
          <p class="status" id="status">idle</p>
        </header>

        <button class="call" id="call">Start call</button>
        <p class="mic-notice" id="mic-notice" role="status"></p>

        <label class="toggle">
          <input type="checkbox" id="talk-over" />
          <span>let me interrupt (needs headphones)</span>
        </label>
      </div>

      <section class="conversation" aria-label="Conversation">
        <h2 class="conversation-title">Transcript</h2>
        <div class="log" id="log" role="log" aria-label="Transcript" tabindex="0"></div>

        <form class="type" id="type-form">
          <input id="type-input" aria-label="Type a message" placeholder="or type instead of speaking" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
